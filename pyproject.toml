[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "upgrade-gate"
version = "0.1.0"
description = "Cost-aware, statistically sound go/no-go gate for LLM model upgrades"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6",
  "jinja2>=3.1",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
upgrade-gate = "upgrade_gate.cli:main"

[tool.setuptools.packages.find]
include = ["upgrade_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
