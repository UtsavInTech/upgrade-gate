<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Upgrade Gate replays your tasks on the old and new AI model, blocks upgrades that start failing silently, and checks safer routes." />
    <link rel="icon" type="image/svg+xml" href="brand/mark.svg" />
    <meta name="theme-color" content="#f7f9fc" />
    <title>Upgrade Gate</title>
    <script>
      try {
        var t = localStorage.getItem("ug-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
