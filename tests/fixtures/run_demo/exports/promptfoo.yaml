# Supply a provider: promptfoo eval -c promptfoo.yaml --providers <provider-id>
# Image tasks: configure a multimodal prompt template using vars.attachments.
description: 'Upgrade Gate confirmed regressions: run_demo'
prompts:
- '{{prompt}}'
tests:
- description: demo-000 / doc-image / hi
  vars:
    prompt: संलग्न चालान पढ़ें। invoice_id और total_inr JSON में दें।
    attachments:
    - tests/fixtures/run_demo/assets/demo-000.svg
  assert:
  - type: is-json
  - type: javascript
    value: "const canonical = x => Array.isArray(x) ? x.map(canonical) :\n  x !==\
      \ null && typeof x === 'object' ? Object.fromEntries(Object.keys(x).sort().map(k\
      \ => [k, canonical(x[k])])) : x;\nconst equal = (a,b) => JSON.stringify(canonical(a))\
      \ === JSON.stringify(canonical(b));\nconst expected = {\"invoice_id\": \"INV-0000\"\
      , \"total_inr\": 1200};\ntry { const actual = JSON.parse(output); return Object.keys(expected).every(k\
      \ => Object.prototype.hasOwnProperty.call(actual,k) && equal(actual[k], expected[k]));\
      \ } catch { return false; }"
