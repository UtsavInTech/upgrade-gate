name: upgrade-gate

# Runs when a pull request changes the shipped model (release/model.json). Each suite replays the saved
# answers in evidence/<suite>/ for the old and new model; no API key is needed. A NO-GO fails the check,
# and the deploy job, which needs every check, is skipped. With branch protection requiring these checks,
# GitHub also blocks the merge.
on:
  pull_request:
    paths:
      - "release/model.json"
      - "release/policy.json"
      - "evidence/**"
      - "upgrade_gate/**"
      - "scripts/ci_gate.py"
      - ".github/workflows/upgrade-gate.yml"
      - "action.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    name: upgrade-gate / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [voice-notes, real-voices, text-and-documents]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Gate the model change
        run: python scripts/ci_gate.py ${{ matrix.suite }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-gate-${{ matrix.suite }}
          path: ${{ runner.temp }}/upgrade-gate-${{ matrix.suite }}/
          if-no-files-found: ignore

  live:
    # A small fresh sample on both models through the reusable Action (action.yml at the repo root),
    # capped at $1. Skipped (passes) when the repo has no MODEL_API_KEY secret. Only NO-GO fails it.
    name: upgrade-gate / voice-notes (live sample)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the model change
        id: models
        run: |
          echo "candidate=$(python3 -c 'import json;print(json.load(open("release/model.json"))["model"])')" >> "$GITHUB_OUTPUT"
          echo "baseline=$(git show origin/${{ github.base_ref || 'main' }}:release/model.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["model"])')" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          name: voice-notes
          mode: live
          tasks: audio-clips
          n: "10"
          budget: "1"
          policy: release/policy.json
          baseline: ${{ steps.models.outputs.baseline }}
          candidate: ${{ steps.models.outputs.candidate }}
          api-key: ${{ secrets.MODEL_API_KEY }}

  deploy:
    name: deploy model
    needs: [gate, live]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ship the new model
        run: |
          echo "All upgrade checks passed. Shipping $(python3 -c 'import json; print(json.load(open("release/model.json"))["model"])')."
          # replace with your real deployment step
