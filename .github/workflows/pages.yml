# Publishes the website (web/) to GitHub Pages on every push to main that touches it.
# One-time switch-on: Settings → Pages → Build and deployment → Source: GitHub Actions.
# The site is static: VoiceOrder uses saved answers (web/public/data/voiceorder.json), no API key is used.
name: site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: No private recordings in the site
        run: |
          if grep -rl "audio-real" web/dist --include='*.m4a' --include='*.wav' 2>/dev/null; then
            echo "real-voice recordings found in web/dist" && exit 1
          fi
          ! find web/dist -name '*.wav' | grep -q .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
